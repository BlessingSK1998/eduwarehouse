<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduWarehouse Dashboard</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1a1a18;--mute:#6b6b66;--line:#e3e3de;--accent:#2a5bd7;--warn:#b45309;
--c1:#2a5bd7;--c2:#d9480f;--c3:#2b8a3e;--c4:#9c36b5;--c5:#0c8599;--c6:#c2255c;--c7:#5c940d;--c8:#6b6b66}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecece8;--mute:#9a9a93;--line:#33332f;--accent:#7aa2ff;--warn:#f0a35e;
--c1:#7aa2ff;--c2:#ff9462;--c3:#6fcf85;--c4:#d48be6;--c5:#5fd0e0;--c6:#f27aa5;--c7:#a8d65c;--c8:#9a9a93}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:1080px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 20px;font-size:13px}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.kpi span{color:var(--mute);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
svg{width:100%;height:auto;display:block;overflow:visible}svg text{fill:var(--mute);font-size:12px}
.lbl{cursor:pointer;outline:none}.lbl:focus-visible text{text-decoration:underline}
.dim{opacity:.18}.line,.lbl,.pt{transition:opacity .15s}
details{margin-top:10px;font-size:13px}summary{cursor:pointer;color:var(--accent);padding:4px 0}
.dt{max-height:280px;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:8px}
.dt table{font-size:12px}.dt th{position:sticky;top:0;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}th{color:var(--mute);font-weight:600}
.note{border-left:3px solid var(--warn);padding-left:12px;color:var(--mute);font-size:13px;margin-top:12px}
.empty{color:var(--mute);font-size:13px;padding:24px 0}
.tablewrap{overflow-x:auto}
</style>
</head>
<body>
<main>
<h1>EduWarehouse</h1>
<p class="sub">Education indicators from the World Bank, UNESCO UIS and Eurostat. Built <span id="built"></span> from the dbt marts.</p>
<label for="ind" class="sub">Indicator&nbsp;</label><select id="ind"></select>
<div class="kpis" id="kpis"></div>
<div class="grid">
  <div class="card"><h2>Regional average over time</h2><div id="trend"></div><details><summary>View as table</summary><div class="dt" id="trendTable"></div></details></div>
  <div class="card"><h2>Highest and lowest, latest available year</h2><div id="rank"></div><details><summary>View all countries as table</summary><div class="dt" id="rankTable"></div></details></div>
</div>
<div class="card" style="margin-top:12px"><h2>Data coverage</h2><div class="tablewrap"><table id="cov"></table></div>
  <p class="note" id="recon"></p></div>
</main>
<script>
const D = /*__DATA__*/null;
const $ = id => document.getElementById(id), NS = "http://www.w3.org/2000/svg";
const COLORS = ["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8"].map(v=>`var(${v})`);
const DASH = ["","7 3","2 3","8 3 2 3","","7 3","2 3","8 3 2 3"];   // second cue besides colour
const SHORT = {"East Asia & Pacific":"East Asia","Europe & Central Asia":"Europe/C. Asia","Latin America & Caribbean":"Latin America",
  "Middle East, North Africa, Afghanistan & Pakistan":"MENA+AF/PK","North America":"N. America","Sub-Saharan Africa":"Sub-Sah. Africa"};
const SOURCE = {worldbank:"World Bank",uis:"UNESCO UIS",eurostat:"Eurostat"};
const fmt = (x,d=1)=>x==null?"–":Number(x).toLocaleString(undefined,{maximumFractionDigits:d});
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const median = a=>{a=[...a].sort((x,y)=>x-y);const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const el=(n,a,t)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e};
const THIS_YEAR=new Date().getFullYear();

$("built").textContent = D.built_at;
const themes=[...new Set(D.indicators.map(i=>i.theme))];
$("ind").innerHTML = themes.map(t=>`<optgroup label="${esc(t)}">`+D.indicators.filter(i=>i.theme===t)
  .map(i=>`<option value="${i.indicator_key}">${esc(i.indicator_name)}</option>`).join("")+"</optgroup>").join("");

let state={};                                  // current selection, so charts can redraw on resize
function render(){
  const key=$("ind").value, meta=D.indicators.find(i=>i.indicator_key===key);
  const latest=D.latest.filter(r=>r.indicator_key===key);
  const trends=D.trends.filter(r=>r.indicator_key===key);
  state={meta,latest,trends};
  const yrs=latest.map(r=>r.year);
  $("kpis").innerHTML=[
    [latest.length,"countries with data"],
    [latest.length?fmt(median(latest.map(r=>r.value)))+" "+esc(meta.unit):"–","median, latest value"],
    [yrs.length?Math.max(...yrs):"–","most recent year · "+esc(SOURCE[meta.source]||meta.source)]
  ].map(([b,s])=>`<div class="card kpi"><b>${b}</b><span>${s}</span></div>`).join("");
  draw(); drawTables();
}
function draw(){ drawTrend(state.trends,state.meta); drawRank(state.latest,state.meta); }

function drawTrend(rows,meta){
  const box=$("trend");box.innerHTML="";
  if(!rows.length){box.innerHTML='<div class="empty">Not enough countries per region (need 3+) for this indicator.</div>';return}
  const W=Math.max(260,box.clientWidth),H=Math.round(Math.min(300,Math.max(220,W*0.62)));  // 1 viewBox unit = 1 CSS px
  const regions=[...new Set(rows.map(r=>r.region))].sort();
  const m={l:38,r:108,t:10,b:26};
  const xs=rows.map(r=>r.year),ys=rows.map(r=>r.v);
  const x0=Math.min(...xs),x1=Math.max(...xs),y1=Math.max(...ys)*1.05,y0=Math.min(0,Math.min(...ys));
  const X=v=>m.l+(x1===x0?0.5:(v-x0)/(x1-x0))*(W-m.l-m.r),Y=v=>H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
  const s=el("svg",{viewBox:`0 0 ${W} ${H}`,width:W,height:H,role:"img","aria-label":`Regional average of ${meta.indicator_name} over time. A table of the values follows.`});
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;s.append(el("line",{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:"var(--line)"}),el("text",{x:m.l-6,y:Y(v)+4,"text-anchor":"end"},fmt(v,0)))}
  [x0,x1].forEach((v,i)=>s.append(el("text",{x:X(v),y:H-6,"text-anchor":i?"end":"start"},v)));
  const groups=[],ends=[];
  regions.forEach((rg,i)=>{
    const pts=rows.filter(r=>r.region===rg).sort((a,b)=>a.year-b.year),c=COLORS[i%COLORS.length];
    const g=el("g",{class:"line"});
    g.append(el("path",{d:pts.map((p,j)=>(j?"L":"M")+X(p.year)+" "+Y(p.v)).join(""),fill:"none",stroke:c,"stroke-width":2,"stroke-dasharray":DASH[i%DASH.length]}));
    pts.forEach(p=>{const d=el("circle",{cx:X(p.year),cy:Y(p.v),r:pts.length<8?3:2,fill:c});d.append(el("title",{},`${rg} ${p.year}: ${fmt(p.v)} (${p.n} countries)`));g.append(d)});
    s.append(g);groups.push(g);
    const last=pts[pts.length-1];ends.push({i,rg,c,y:Y(last.v),x:X(last.year)});
  });
  // direct labels at line ends, nudged apart so they don't overlap
  ends.sort((a,b)=>a.y-b.y);const gap=14;
  ends.forEach((e,k)=>{e.ly=k&&e.y<ends[k-1].ly+gap?ends[k-1].ly+gap:e.y});
  const over=ends.length?ends[ends.length-1].ly-(H-m.b):0;if(over>0)ends.forEach(e=>e.ly-=over);
  const labels=[];
  ends.forEach(e=>{
    const t=el("g",{class:"lbl",tabindex:0,role:"button","aria-label":`Highlight ${e.rg}`});
    const lx=W-m.r+10;
    t.append(el("line",{x1:e.x+3,y1:e.y,x2:lx-3,y2:e.ly,stroke:e.c,"stroke-width":1,opacity:.55}),
      el("rect",{x:lx-3,y:e.ly-9,width:m.r-4,height:16,fill:"transparent"}),
      el("text",{x:lx,y:e.ly+4,style:`fill:${e.c};font-weight:600`},SHORT[e.rg]||e.rg));
    t.append(el("title",{},e.rg));s.append(t);labels.push([e.i,t]);
  });
  const focus=i=>{groups.forEach((g,j)=>g.classList.toggle("dim",i!=null&&j!==i));labels.forEach(([j,t])=>t.classList.toggle("dim",i!=null&&j!==i))};
  labels.forEach(([i,t])=>{["mouseenter","focus"].forEach(ev=>t.addEventListener(ev,()=>focus(i)));["mouseleave","blur"].forEach(ev=>t.addEventListener(ev,()=>focus(null)))});
  box.append(s);
}

function drawRank(latest,meta){
  const box=$("rank");box.innerHTML="";
  if(latest.length<2){box.innerHTML='<div class="empty">No data.</div>';return}
  const sorted=[...latest].sort((a,b)=>b.value-a.value);
  const n=Math.min(8,sorted.length>>1),rows=[...sorted.slice(0,n),null,...sorted.slice(-n)];
  const W=Math.max(260,box.clientWidth),rh=26,H=rows.length*rh+8;
  const lw=Math.min(150,Math.round(W*0.4)),vw=84,max=Math.max(...sorted.map(r=>r.value))||1,chars=Math.floor((lw-8)/6.6);
  const s=el("svg",{viewBox:`0 0 ${W} ${H}`,width:W,height:H,role:"img","aria-label":`Highest and lowest countries for ${meta.indicator_name}. A table of all countries follows.`});
  rows.forEach((r,i)=>{
    const y=i*rh+4;
    if(!r){s.append(el("text",{x:lw,y:y+16},"⋯"));return}
    const w=Math.max(1,r.value/max*(W-lw-vw)),top=i<n,old=THIS_YEAR-r.year>5;
    const g=el("g",{opacity:old?.6:1});
    g.append(el("text",{x:lw-8,y:y+16,"text-anchor":"end"},r.name.length>chars?r.name.slice(0,chars-1)+"…":r.name));
    const b=el("rect",{x:lw,y:y+3,width:w,height:rh-9,rx:2,fill:top?"var(--c1)":"var(--c2)"});
    b.append(el("title",{},`${r.name} (${r.year}): ${fmt(r.value)} ${meta.unit}${old?" · older than 5 years":""}`));g.append(b);
    g.append(el("text",{x:lw+w+6,y:y+16},`${fmt(r.value)} · ${r.year}`));s.append(g);
  });
  box.append(s);
}

function drawTables(){
  const {meta,latest,trends}=state, u=esc(meta.unit);
  const yrs=[...new Set(trends.map(r=>r.year))].sort(), regs=[...new Set(trends.map(r=>r.region))].sort();
  const at={};trends.forEach(r=>at[r.region+"|"+r.year]=r.v);
  $("trendTable").innerHTML=trends.length?`<table><tr><th>Year</th>${regs.map(r=>`<th class="n">${esc(r)}</th>`).join("")}</tr>`+
    yrs.map(y=>`<tr><td>${y}</td>${regs.map(r=>`<td class="n">${fmt(at[r+"|"+y])}</td>`).join("")}</tr>`).join("")+"</table>":"<p class='empty'>No data.</p>";
  $("rankTable").innerHTML=`<table><tr><th>Country</th><th>Region</th><th class="n">Value (${u})</th><th class="n">Year</th></tr>`+
    [...latest].sort((a,b)=>b.value-a.value).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.region||"")}</td><td class="n">${fmt(r.value)}</td><td class="n">${r.year}</td></tr>`).join("")+"</table>";
}

$("cov").innerHTML="<tr><th>Indicator</th><th>Source</th><th class='n'>Countries</th><th class='n'>Observations</th><th class='n'>Years</th></tr>"+
  D.coverage.map(c=>`<tr><td>${esc(c.indicator_name)}</td><td>${esc(SOURCE[c.source]||c.source)}</td><td class="n">${c.n_countries}</td><td class="n">${c.n_observations.toLocaleString()}</td><td class="n">${c.first_year}–${c.last_year}</td></tr>`).join("");
const r=D.reconciliation;
$("recon").textContent=`Source check: World Bank and UIS both publish primary completion. Across ${r.n_pairs} country-years they overlap, the median gap is ${r.median_diff} points and ${r.pct_over_5}% differ by more than 5 points (different definitions of "completion"). The pipeline reports this as a dbt warning, not a failure.`;
$("ind").addEventListener("change",render);render();
let lastW=0;new ResizeObserver(()=>{const w=$("trend").clientWidth;if(w&&w!==lastW){lastW=w;draw()}}).observe($("trend"));
</script>
</body>
</html>
